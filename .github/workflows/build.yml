name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # für das öffentliche Release mit der APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Release-APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk LumenTV.apk
          echo "VERSION=$(grep -m1 versionName app/build.gradle | sed -E "s/.*'(.*)'.*/\1/")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LumenTV-APK
          path: LumenTV.apk

      # Immer gleiche Adresse für die neueste Version:
      # https://github.com/<owner>/<repo>/releases/latest/download/LumenTV.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Lumen TV ${{ env.VERSION }} (Build ${{ github.run_number }})
          make_latest: true
          files: LumenTV.apk
