plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.lumen.tvlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.lumen.tvlauncher'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // Fester Schlüssel: Updates lassen sich über die alte Version installieren,
    // Einstellungen und Berechtigungen bleiben erhalten. Bewusst im Repo, nur für den Eigengebrauch.
    signingConfigs {
        lumen {
            storeFile file('lumen-release.jks')
            storePassword 'lumentv'
            keyAlias 'lumen'
            keyPassword 'lumentv'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.lumen
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Bewusst keine Abhängigkeiten: reines Android-Framework -> winzige APK, schneller Start.
